# Same URL layout as production, without the cPanel-only parts of the root .htaccess
# (the forced HTTPS redirect and the "ea-php82" handler would break a local http:// site).
#   http://localhost:8080/            -> frontend/web
#   http://localhost:8080/web-admin   -> backend/web  (admin panel)
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        AllowOverride None
        Require all granted
        Options -Indexes +FollowSymLinks

        RewriteEngine On
        RewriteRule ^(frontend|backend)/web/ - [L]
        RewriteRule ^web-admin(/(.*))?$ backend/web/$2 [L]
        RewriteRule ^(.*)$ frontend/web/$1 [L]
    </Directory>

    # The web folders keep their own .htaccess (Yii routing, caching headers)
    <Directory /var/www/html/frontend/web>
        AllowOverride All
    </Directory>
    <Directory /var/www/html/backend/web>
        AllowOverride All
    </Directory>

    # Never serve source/config folders directly
    <DirectoryMatch "^/var/www/html/(common|console|environments|vendor|docker|frontend/(config|controllers|models|views|runtime)|backend/(config|controllers|models|views|runtime))">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
