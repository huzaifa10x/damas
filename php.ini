; cPanel-generated php ini directives, do not edit
; Manual editing of this file may result in unexpected behavior.
; To make changes to this file, use the cPanel MultiPHP INI Editor (Home >> Software >> MultiPHP INI Editor)
; For more information, read our documentation (https://go.cpanel.net/EA4ModifyINI)

; cPanel-generated php ini directives
display_errors = Off
max_execution_time = 120
max_input_time = 120
max_input_vars = 3000
memory_limit = 512M
post_max_size = 100M
upload_max_filesize = 100M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/ea-php82"

; Enable Gzip Output Compression via PHP
zlib.output_compression = On
zlib.output_compression_level = 6

; OPcache High Performance Settings
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.save_comments = 1

; PHP 8.2 JIT Compiler Setup
opcache.jit_buffer_size = 128M
opcache.jit = tracing

; File Path Resolution Caching
realpath_cache_size = 4096K
realpath_cache_ttl = 600
